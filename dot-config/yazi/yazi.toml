[preview]
max_width = 2000
max_height = 2000

[mgr]
ratio = [1, 2, 4]

[opener]
zathura = [{ run = 'zathura %s', block = false, orphan = true, for = "unix" }]
mpv_audio = [{ run = 'mpv --no-vid %s', block = true, for = "unix" }]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "zathura" },
  { mime = "audio/mpeg", use = "mpv_audio" },
]
